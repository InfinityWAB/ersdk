name: Release

# Publication declenchee par un tag `vX.Y.Z` uniquement.
#
# Pourquoi un tag et pas un push sur main : la version publiee doit correspondre
# a un point precis de l'historique, identifiable et immuable. Publier sur chaque
# push rendrait impossible de dire quel commit correspond a la version installee
# chez un consommateur.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # Garde-fou : le tag fait foi, mais c'est `package.json` qui determine la
      # version reellement publiee. Une divergence produirait un paquet dont le
      # numero ne correspond a aucun tag — impossible a retrouver ensuite.
      # Ignore sur workflow_dispatch : GITHUB_REF_NAME vaut alors le nom de la
      # branche, pas une version. Le declenchement manuel sert au diagnostic et
      # a republier apres correction d'un secret, sans avoir a creer un tag.
      - name: Verifier que le tag correspond a la version du package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Le tag v$TAG ne correspond pas a la version $PKG du package.json."
            echo "Corrigez package.json puis retaguez, ou supprimez ce tag."
            exit 1
          fi

      # Refuse de republier une version deja presente sur le registre. npm
      # rejetterait de toute facon, mais avec un message peu clair — autant
      # echouer tot et explicitement.
      - name: Verifier que la version n'est pas deja publiee
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG est deja publie. Incrementez la version."
            exit 1
          fi
          echo "$NAME@$PKG n'existe pas encore sur le registre."

      # Diagnostic AVANT la publication. Sur un paquet scope inexistant, npm
      # repond 404 a la place de 403 — deliberement, pour ne pas reveler
      # l'existence d'un scope prive. Ce 404 ne dit donc pas si le scope
      # n'existe pas, si le jeton est invalide, ou s'il n'a pas les droits.
      # On leve l'ambiguite ici plutot que de laisser lire un message opaque.
      - name: Verifier l'acces au registre
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Le secret NPM_TOKEN est absent ou vide."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          echo "── Compte authentifie ──"
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::Jeton invalide ou expire : $WHO"
            echo "Regenerez un jeton npm de type Automation."
            exit 1
          fi
          echo "npm whoami : $WHO"

          SCOPE=$(node -p "require('./package.json').name.split('/')[0].replace('@','')")
          echo "── Acces au scope @$SCOPE ──"
          if npm org ls "$SCOPE" >/dev/null 2>&1; then
            echo "OK : $WHO est membre de l'organisation $SCOPE."
          else
            echo "::error::Le compte $WHO n'a pas acces a l'organisation npm '$SCOPE'."
            echo "Deux causes possibles :"
            echo "  1. L'organisation n'existe pas  ->  npm org create $SCOPE"
            echo "  2. Le jeton est un granular access token trop restreint."
            echo "     Pour creer un paquet qui n'existe pas encore, il doit"
            echo "     couvrir le SCOPE entier en lecture-ecriture, pas une"
            echo "     liste de paquets."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Contenu du paquet
        run: npm pack --dry-run

      # `--access public` est indispensable : un paquet scope (@…/…) est publie
      # en `restricted` par defaut, ce qui exige un plan payant et le rendrait
      # inaccessible aux consommateurs.
      - name: Publier sur npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resume
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          echo "### Publie : \`$NAME@$PKG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "npm i -D $NAME@$PKG" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
